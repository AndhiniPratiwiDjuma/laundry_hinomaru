<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAUNDRY HINOMARU — Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <style>
        .login-page{min-height:100vh;display:grid;place-items:center;padding:28px;position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(233,247,255,.91),rgba(247,252,255,.88)),url('assets/background.svg') center/cover}
        .login-page:before,.login-page:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
        .login-page:before{width:560px;height:560px;right:-190px;top:-250px;background:rgba(42,145,205,.14);box-shadow:0 0 0 70px rgba(42,145,205,.045)}
        .login-page:after{width:430px;height:430px;left:-190px;bottom:-230px;background:rgba(16,47,85,.09)}
        .login-card{width:min(430px,100%);position:relative;z-index:2;padding:34px;background:rgba(255,255,255,.97);border:1px solid rgba(42,145,205,.16);border-radius:28px;box-shadow:0 28px 80px rgba(16,47,85,.16)}
        .login-brand{display:flex;align-items:center;gap:13px;margin-bottom:26px}.login-brand img{width:52px;height:52px;object-fit:contain}.login-brand strong{display:block;color:#102f55;font-size:18px}.login-brand span{font-size:11px;color:#71879b}
        .login-title{font-size:30px;color:#102f55;margin:0 0 7px}.login-subtitle{font-size:13px;color:#6d8297;margin:0 0 22px}.login-card label{display:block;color:#254667;font-size:12px;font-weight:800;margin:14px 0 7px}
        .login-card input,.login-card select{width:100%;box-sizing:border-box;border:1px solid #c8ddea;border-radius:13px;padding:12px 14px;background:#f8fcff;color:#173653;outline:none}.login-card input:focus,.login-card select:focus{border-color:#278dca;box-shadow:0 0 0 4px rgba(39,141,202,.11)}
        .login-primary{width:100%;border:0;border-radius:13px;padding:13px;margin-top:19px;background:linear-gradient(135deg,#102f55,#238dcc);color:#fff;font-weight:800;cursor:pointer}.login-secondary{width:100%;border:1px solid #c7ddeb;border-radius:13px;padding:11px;margin-top:9px;background:#eef8fd;color:#174b73;font-weight:800;cursor:pointer}
        .login-link{display:block;text-align:center;margin-top:16px;color:#267caf;font-size:12px;text-decoration:none;font-weight:800}.login-note{text-align:center;color:#8a9cac;font-size:11px;margin-top:18px}.msg{display:none;margin-top:13px;padding:10px 12px;border-radius:11px;font-size:12px}.msg.error{color:#b84747;background:#fff0ef;border:1px solid #ffd1cd}.msg.success{color:#17755a;background:#eaf9f3;border:1px solid #bdebd9}.hidden{display:none!important}.cashier-list{margin-top:15px;display:grid;gap:8px}.cashier-chip{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid #d8e8f2;background:#f6fbfe;border-radius:12px;color:#23496a;font-size:12px}
    </style>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
<main class="login-page">
    <section class="login-card">
        <div class="login-brand">
            <img src="assets/logo-hinomaru-bright.png" alt="Laundry Hinomaru">
            <div><strong>LAUNDRY HINOMARU</strong><span>Sistem Kasir Laundry</span></div>
        </div>

        <div id="loginView">
            <h1 class="login-title">Masuk</h1>
            <p class="login-subtitle">Masuk ke sistem kasir Laundry Hinomaru.</p>
            <form id="loginForm">
                <label for="username">Username</label>
                <input id="username" type="text" placeholder="Username kasir" autocomplete="username" required>
                <label for="password">Password</label>
                <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
                <button class="login-primary" type="submit">Masuk</button>
            </form>
            <div class="msg error" id="loginError"></div>
            <button type="button" class="login-secondary" id="toggleCashier">Kelola Kasir</button>
        </div>

        <div id="cashierView" class="hidden">
            <h1 class="login-title">Kelola Kasir</h1>
            <p class="login-subtitle"></p>
            <form id="cashierForm">
                <label for="cashierNameInput">Nama Kasir</label>
                <input id="cashierNameInput" type="text" placeholder="Nama kasir" required>
                <label for="cashierUsernameInput">Username</label>
                <input id="cashierUsernameInput" type="text" placeholder="Username" required>
                <label for="cashierPasswordInput">Password</label>
                <input id="cashierPasswordInput" type="password" placeholder="Password" required>
                <label for="cashierPasswordConfirm">Konfirmasi Password</label>
                <input id="cashierPasswordConfirm" type="password" placeholder="Ulangi password" required>
                <button class="login-primary" type="submit">Tambah Kasir</button>
            </form>
            <div class="msg error" id="cashierError"></div>
            <div class="msg success" id="cashierSuccess"></div>
            <button type="button" class="login-secondary" id="backToLogin">Kembali ke Login</button>
        </div>

        <p class="login-note">LAUNDRY HINOMARU</p>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
